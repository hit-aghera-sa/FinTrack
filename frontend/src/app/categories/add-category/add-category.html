<div class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900">
  <!-- Navbar -->
  <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center space-x-3">
          <div
            class="w-10 h-10 bg-gradient-to-br from-blue-500 to-blue-600 rounded-lg flex items-center justify-center"
          >
            <span class="text-white font-bold text-lg">₹</span>
          </div>
          <h1 class="text-2xl font-bold text-white">FinTrack</h1>
        </div>

        <!-- Logout -->
        <button
          (click)="logout()"
          class="px-4 py-2 bg-red-600 text-white rounded-lg transition font-medium"
        >
          Logout
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <!-- Page Header -->
    <div class="mb-8 text-center">
      <h2 class="text-3xl font-bold text-white mb-2">Add Category</h2>
      <p class="text-gray-400">Create a new category to organize your transactions</p>
    </div>

    <!-- Form Card -->
    <div class="bg-gray-800 rounded-2xl p-6 border border-gray-700 shadow-xl">
      <form #f="ngForm" (ngSubmit)="submit()" class="space-y-6">
        <!-- Category Name -->
        <div>
          <label class="text-gray-300 block mb-3 font-medium text-lg">Category Name</label>

          <input
            type="text"
            [(ngModel)]="name"
            name="name"
            class="w-full p-4 rounded-xl bg-gray-700 text-white focus:ring-2 focus:ring-blue-500 border outline-none transition"
            [class.border-red-500]="errorMessage"
            placeholder="e.g., Food, Utilities, Entertainment"
          />

          <!-- Error message -->
          <div
            *ngIf="errorMessage"
            class="bg-red-500/20 text-red-400 border border-red-500/30 px-4 py-3 rounded-xl mt-3 animate-fadeIn"
          >
            {{ errorMessage }}
          </div>
        </div>

        <!-- Type Selection -->
        <div>
          <label class="text-gray-300 block mb-3 font-medium text-lg">Type</label>

          <div class="grid grid-cols-2 gap-4">
            <!-- Expense -->
            <div class="cursor-pointer" (click)="type = 'expense'">
              <div
                class="p-3 h-20 flex flex-col justify-center border-2 rounded-xl text-center transition"
                [class.border-red-500]="type === 'expense'"
                [class.border-gray-600]="type !== 'expense'"
              >
                <span class="font-semibold text-red-400 text-lg">Expense</span>
              </div>
            </div>

            <!-- Income -->
            <div class="cursor-pointer" (click)="type = 'income'">
              <div
                class="p-3 h-20 flex flex-col justify-center border-2 rounded-xl text-center transition"
                [class.border-green-500]="type === 'income'"
                [class.border-gray-600]="type !== 'income'"
              >
                <span class="font-semibold text-green-400 text-lg">Income</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Buttons -->
        <div class="flex gap-4 pt-4">
          <button
            type="submit"
            class="flex-1 bg-blue-600 text-white py-4 rounded-xl font-medium transition flex items-center justify-center space-x-2"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 4v16m8-8H4"
              ></path>
            </svg>
            <span>Add Category</span>
          </button>

          <button
            type="button"
            class="flex-1 bg-gray-600 text-white py-4 rounded-xl font-medium transition flex items-center justify-center space-x-2"
            (click)="cancel()"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
            <span>Cancel</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
