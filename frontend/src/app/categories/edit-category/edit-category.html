<div class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900">

  <!-- Navbar -->
  <nav class="bg-gray-800/80 backdrop-blur-xl border-b border-gray-700/50 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl flex items-center justify-center">
            <span class="text-white font-bold text-lg">₹</span>
          </div>
          <h1 class="text-2xl font-bold text-white">FinTrack</h1>
        </div>

        <button
          
          class="px-4 py-2 bg-red-600 text-white rounded-xl font-medium"
        >
          Logout
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- Header -->
    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-8 gap-4">
      <div class="space-y-2">
        <h2 class="text-4xl font-bold text-white">Edit Category</h2>
        <p class="text-gray-400 text-lg">Update your category details</p>
      </div>

      <button
        (click)="goBack()"
        class="px-6 py-3.5 bg-gray-600 text-white rounded-2xl font-semibold flex items-center space-x-3"
      >
        <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </div>
        <span>Cancel</span>
      </button>
    </div>

    <!-- Edit Form Card -->
    <div class="max-w-2xl mx-auto">
      <div class="bg-gray-800/60 backdrop-blur-sm border border-gray-700/50 rounded-2xl p-8 shadow-xl">
        
        <form (ngSubmit)="save()" class="space-y-6">
          
          <!-- Category Name Input -->
          <div class="space-y-3">
            <label class="text-gray-300 font-medium text-lg block">
              Category Name
            </label>
            <input
              [(ngModel)]="name"
              name="name"
              type="text"
              class="w-full p-4 bg-gray-700/50 border border-gray-600/50 text-white rounded-xl placeholder-gray-500"
              placeholder="Enter category name"
            />
            <p class="text-gray-500 text-sm">Choose a descriptive name for your category</p>
          </div>

          <!-- Action Buttons -->
          <div class="flex flex-col sm:flex-row gap-4 pt-6">
            <button 
              type="submit"
              class="flex-1 bg-blue-600 text-white font-semibold py-4 px-6 rounded-xl flex items-center justify-center space-x-2"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
              <span>Save Changes</span>
            </button>

            <button 
              type="button"
              (click)="goBack()"
              class="flex-1 bg-gray-700/50 text-gray-300 font-semibold py-4 px-6 rounded-xl border border-gray-600/50 flex items-center justify-center space-x-2"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
              <span>Cancel</span>
            </button>
          </div>

        </form>

        <!-- Additional Info -->
        <div class="mt-8 pt-6 border-t border-gray-700/50">
          <div class="flex items-center space-x-3 text-gray-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span class="text-sm">Editing category will update it across all associated transactions</span>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
