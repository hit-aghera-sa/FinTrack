<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 p-4">
  <div class="w-full max-w-lg bg-gray-800 rounded-2xl shadow-xl overflow-hidden">
    <div class="px-8 py-10 sm:p-10">

      <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-white">Reset Password</h2>
        <p class="mt-2 text-gray-400">Enter your new password below</p>
      </div>

      <form [formGroup]="resetForm" (ngSubmit)="submit()" class="space-y-6">

        <div class="space-y-1">
          <label class="block text-sm font-medium text-gray-300">New Password</label>
          <input 
            type="password"
            formControlName="password"
            class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white"
            placeholder="••••••••"
            required>
        </div>

        <div class="space-y-1">
          <label class="block text-sm font-medium text-gray-300">Confirm New Password</label>
          <input 
            type="password"
            formControlName="passwordConfirm"
            class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white"
            placeholder="••••••••"
            required>
        </div>

        <p *ngIf="errorMessage" class="text-red-400 text-sm font-medium">
          {{ errorMessage }}
        </p>

        <p *ngIf="successMessage" class="text-green-400 text-sm font-medium">
          {{ successMessage }}
        </p>

        <button
          type="submit"
          class="w-full flex justify-center py-3 px-4 rounded-lg text-sm font-medium text-white bg-blue-600 hover:bg-blue-700"
          [disabled]="loading || resetForm.invalid">
          
          <svg *ngIf="loading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0"></path>
          </svg>

          {{ loading ? 'Updating...' : 'Reset Password' }}
        </button>

      </form>

      <div class="mt-6 text-center">
        <a routerLink="/login" class="text-sm font-medium text-blue-400 hover:text-blue-300">
          ← Back to Sign In
        </a>
      </div>

    </div>
  </div>
</div>
