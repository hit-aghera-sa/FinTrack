<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 to-gray-800 p-4">
  <div class="w-full max-w-lg bg-gray-800 rounded-2xl shadow-xl overflow-hidden">
    <div class="px-8 py-10 sm:p-10">
      <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-white">Sign In</h2>
        <p class="mt-2 text-gray-400">Welcome back to your financial dashboard</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="submit()" class="space-y-6">
        <div class="space-y-1">
          <label for="email" class="block text-sm font-medium text-gray-300">Email</label>
          <input 
            id="email"
            type="email"
            formControlName="email"
            class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
            placeholder="you@example.com"
            autocomplete="email"
            required>
        </div>

        <div class="space-y-1">
          <label for="password" class="block text-sm font-medium text-gray-300">Password</label>
          <input 
            id="password"
            type="password"
            formControlName="password"
            class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
            placeholder="••••••••"
            autocomplete="current-password"
            required>
        </div>

        <!-- API Error Message -->
        <p *ngIf="errorMessage" class="text-red-400 text-sm font-medium">
          {{ errorMessage }}
        </p>

        <button
          type="submit"
          class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
          [disabled]="loading || loginForm.invalid">
          <svg *ngIf="loading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>

      <div class="mt-6 space-y-4">
        <div class="text-center">
          <a routerLink="/forgot-password" class="text-sm font-medium text-blue-400 hover:text-blue-300 transition duration-200">
            Forgot your password?
          </a>
        </div>
        <div class="text-center">
          <p class="text-sm text-gray-400">
            Don't have an account? 
            <a routerLink="/signup" class="font-medium text-blue-400 hover:text-blue-300 transition duration-200">
              Sign up
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
